<linearGradient id="hz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFA114"/><stop offset=".5" stop-color="#FA6410"/><stop offset="1" stop-color="#DE1421"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121822"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
