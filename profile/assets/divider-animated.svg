<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="divider"><title>divider</title><style>.s{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}22%{transform:scale(1.012,1.04) skewX(-1.3deg)}48%{transform:scale(.992,1.015) skewX(1deg)}74%{transform:scale(1.01,1.05) skewX(-.6deg)}}@keyframes ember{0%{transform:translate(0,0) scale(1);opacity:0}12%{opacity:.95}100%{transform:translate(var(--dx),var(--rise)) scale(.15);opacity:0}}@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}@keyframes run{from{stroke-dashoffset:70}to{stroke-dashoffset:-1000}}@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes sweep{0%{transform:translateX(-140%)}60%,100%{transform:translateX(140%)}}.glow{animation:breathe 4.5s ease-in-out infinite}.ember{animation:ember 4s ease-in infinite;opacity:0}.pulse{fill:none;stroke:#FFD9A0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70 930;stroke-dashoffset:70;animation:run 3.2s linear infinite}.dia{animation:breathe 2.4s ease-in-out infinite}</style><defs>
